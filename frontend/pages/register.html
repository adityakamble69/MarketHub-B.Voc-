<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Register — MarketHub</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/main.css" />
</head>
<body>
<nav class="navbar">
  <a class="logo" href="../index.html">Market<span>Hub</span></a>
</nav>

<div class="auth-wrapper">
  <div class="auth-card">
    <h2>Create Account</h2>
    <p>Join MarketHub as a buyer or seller</p>

    <div class="error-msg" id="errorMsg"></div>

    <div class="form-group">
      <label>Full Name</label>
      <input type="text" id="name" placeholder="Your full name" />
    </div>
    <div class="form-group">
      <label>Email</label>
      <input type="email" id="email" placeholder="you@example.com" />
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="password" placeholder="Min 8 characters" />
    </div>
    <div class="form-group">
      <label>I want to</label>
      <select id="role">
        <option value="buyer">Buy products</option>
        <option value="vendor">Sell products</option>
      </select>
    </div>

    <button class="form-submit" onclick="handleRegister()">Create Account</button>
    <p class="auth-link">Already have an account? <a href="login.html">Login</a></p>
  </div>
</div>

<script src="../js/api.js"></script>
<script>
  if (Auth.getUser()) location.href = '../index.html';

  async function handleRegister() {
    const name     = document.getElementById('name').value.trim();
    const email    = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const role     = document.getElementById('role').value;
    const errEl    = document.getElementById('errorMsg');
    errEl.classList.remove('show');

    if (!name || !email || !password) {
      errEl.textContent = 'All fields are required.';
      errEl.classList.add('show'); return;
    }
    if (password.length < 8) {
      errEl.textContent = 'Password must be at least 8 characters.';
      errEl.classList.add('show'); return;
    }

    try {
      const { token } = await Auth.register({ name, email, password, role });
      setToken(token);
      location.href = role === 'vendor' ? 'vendor-dashboard.html' : '../index.html';
    } catch (e) {
      errEl.textContent = e.message;
      errEl.classList.add('show');
    }
  }
</script>
</body>
</html>
